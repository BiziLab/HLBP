<!DOCTYPE html>
<html lang="eu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HLBP - Kudeaketa Sistema</title>

    <link
        rel="stylesheet"
        href="css/variables.css"
    >

    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-header">

                <div class="login-logo">
                    HLBP
                </div>

                <h1>
                    Kudeaketa Sistema
                </h1>

                <p>
                    HLBP
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Zure emaila"
                        required
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Pasahitza
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Zure pasahitza"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    id="loginButton"
                >
                    Sartu
                </button>


                <div
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></div>

            </form>

        </section>

    </main>


    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <!-- Configuración -->
    <script src="js/config.js"></script>

    <!-- Conexión -->
    <script src="js/supabase.js"></script>

    <!-- Autenticación -->
    <script src="js/auth.js"></script>

    <!-- Aplicación -->
    <script src="js/app.js"></script>

</body>

</html>
